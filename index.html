<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the model host (Hugging Face) need not learn which page sent the reader -->
    <meta name="referrer" content="no-referrer" />
    <title>What can a machine actually see? · CV × industrial ecology</title>
    <meta
      name="description"
      content="Can a photo help us decide what to repair, reuse or recycle? Follow a desk fan to explore the evidence, from reading labels to identifying materials. A companion to the review by van Lierde et al., “Benchmarked, Rarely Field-Tested: Computer Vision for End-of-Life Product Data in Industrial Ecology”."
    />

    <!-- Inline so it costs no request and cannot 404: the fan's hub and grille. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230072B2' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%230072B2'/%3E%3Cpath d='M16 12.5V4M19.5 18l7.4 4.3M12.5 18l-7.4 4.3' stroke='%230072B2' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Both faces are variable and self-hosted; the CSS that requests them arrives
         with the bundle, so without a preload the first paint sets in the fallback
         and reflows. Vite hashes these to the same assets the stylesheet uses. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/Overpass.woff2" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/assets/OverpassMono.woff2"
    />

    <!-- The rubber-band over-scroll colour before CSS lands, per scheme. -->
    <meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d3b5e" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="What can a machine actually see? · CV × industrial ecology" />
    <meta
      property="og:description"
      content="Can a photo help us decide what to repair, reuse or recycle? Follow one desk fan to see what image-analysis software can tell us, and what still needs testing on used products."
    />
    <meta property="og:url" content="https://simonvanlierde.com/cv-ie-taxonomy/" />
    <!-- served from public/, so it lands at the site root; scrapers need it absolute -->
    <meta
      property="og:image"
      content="https://simonvanlierde.com/cv-ie-taxonomy/screenshot.png"
    />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="1000" />
    <meta
      property="og:image:alt"
      content="A desk fan taken apart, with labels showing its parts, dimensions and materials."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
