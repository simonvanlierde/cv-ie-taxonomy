# Install no package version younger than 7 days (in minutes), as Renovate already waits,
# so a lock refresh or a manual `pnpm add` cannot pull a release published hours ago.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  lefthook: true
  # the browser build uses onnxruntime-web; the Node binding's download is not needed
  onnxruntime-node: false
  protobufjs: false
  # its install script only prints a funding notice
  tesseract.js: false
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.3.3
  - vite@8.3.3
