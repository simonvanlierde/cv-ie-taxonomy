name: cold install

# Runs the README's setup and task commands as written, in a container that has none
# of the tools the README asks for, so a step the README leaves out fails here before
# it fails a new contributor. It runs the ```sh blocks under `## Development`.
on:
  pull_request:
    paths: [README.md, package.json, pnpm-lock.yaml, .github/workflows/cold-install.yml]
  schedule:
    - cron: "47 5 * * 1" # Mondays, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README commands, fresh container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Debian with git, curl and a C compiler, like a new contributor's machine. Pinned
    # to a digest, so a moved tag can't swap the image. Renovate bumps it.
    container: buildpack-deps:trixie@sha256:8db3a3d1e68e0a88ed31c2256d0c0e3b127f80685e6b1f3a9bb31e22638b5e7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools the README's "Requires" sentence names, and nothing more.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Run the README's Development blocks
        # shortcut: drops the dev and preview servers, which never exit, and the Chromium
        # download, whose browser needs system libraries this container lacks; runs the
        # unit tests in place of `test:all`. ci.yml runs the browser tests. The parser
        # reads only ``` fences, and a `## ` line inside a block ends the section.
        run: |-
          awk '/^## /{dev = ($0 == "## Development")}
               dev && /^```/{code = !code && /^```(sh|bash|shell)[[:space:]]*$/; next}
               dev && code' README.md |
            grep -vE '^[[:space:]]*pnpm +(dev|preview|exec +playwright)( |$)' |
            sed -E 's/^([[:space:]]*pnpm +)test:all( |$)/\1test\2/' >"$RUNNER_TEMP/readme.sh" || true
          if ! test -s "$RUNNER_TEMP/readme.sh"; then
            echo "README.md has no sh block under ## Development to run. Add one with the setup commands, or delete .github/workflows/cold-install.yml." >&2
            exit 1
          fi
          # Not a README step: the runner's user owns the checkout and this container
          # runs as root, so git refuses the repository as "dubious ownership".
          chown -R "$(id -u):$(id -g)" .
          bash -ex "$RUNNER_TEMP/readme.sh"
